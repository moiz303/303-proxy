events {
    worker_connections 1024;
}

http {
    upstream flask_bridge {
        server flask_bridge:5000;
    }

    upstream proxy_logic {
        server proxy_logic:5050;
    }

    server {
        listen 5000 ssl;
        server_name 72.56.72.131;
        ssl_certificate /etc/ssl/certs/nginx.crt;
        ssl_certificate_key /etc/ssl/certs/nginx.key;
        location / {
            proxy_pass http://flask_bridge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 5050 ssl;
        server_name 72.56.72.131;
        ssl_certificate /etc/ssl/certs/nginx.crt;
        ssl_certificate_key /etc/ssl/certs/nginx.key;
        location / {
            proxy_pass http://proxy_logic;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name 72.56.72.131;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$server_name:5000$request_uri;
        }
    }
}