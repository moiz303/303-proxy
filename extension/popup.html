<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>303 proxy</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="popup.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>303 proxy</h1>
            <p>Удобный прокси для безопасного сёрфинга</p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Контейнер для авторизованного пользователя (скрыт по умолчанию) -->
        <div id="authorized-view" style="display: none;">
            <!-- Панель вкладок для авторизованных пользователей -->
            <div class="tabs">
                <div class="tab btn-tab" data-tab="connect">Подключение</div>
                <div class="tab btn-tab" data-tab="monitor">Мониторинг</div>
            </div>

            <!-- Вкладка подключения для авторизованных -->
            <div id="connect-tab" class="tab-content active">
                <div class="card">
                    <h3 style="margin-top: 0; color: #667eea;">⚙️ Подключение к прокси</h3>

                    <!-- Информация о текущем пользователе -->
                    <div id="current-user-info" class="user-info-container">
                        <div class="current-user-display">
                            <div class="user-avatar" id="user-avatar">U</div>
                            <div class="user-details">
                                <div class="user-email" id="user-email"></div>
                                <div class="user-id" id="user-id"></div>
                            </div>
                        </div>
                        <button id="logout-btn" class="btn btn-danger">
                            🚪 Выйти
                        </button>
                    </div>

                    <!-- Статус подключения -->
                    <div id="status" class="status status-disconnected">
                        Не подключено
                    </div>

                    <!-- Кнопка подключения/отключения -->
                    <button id="connectButton" class="btn btn-primary">
                        🔗 Подключиться
                    </button>
                </div>
            </div>

            <!-- Вкладка мониторинга для авторизованных -->
            <div id="monitor-tab" class="tab-content">
                <div class="card">
                    <h3 style="margin-top: 0; color: #667eea;">📊 Активные подключения</h3>

                    <!-- Информация о пользователе -->
                    <div class="user-info-container" style="margin-bottom: 15px;">
                        <div class="current-user-display">
                            <div class="user-avatar" id="user-avatar-monitor">U</div>
                            <div class="user-details">
                                <div class="user-email" id="user-email-monitor"></div>
                                <div class="user-id" id="user-id-monitor"></div>
                            </div>
                        </div>
                    </div>

                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-label">Подключено</div>
                            <div class="stat-value" id="totalConnections">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Статус API</div>
                            <div class="stat-value" id="apiStatus">❓</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 8px; margin-top: 15px;">
                        <button id="refresh-btn" class="btn btn-primary" style="flex: 1;">
                            🔄 Обновить
                        </button>
                        <button id="auto-refresh-btn" class="btn btn-success" style="flex: 1;">
                            ▶️ Авто
                        </button>
                        <button id="stop-refresh-btn" class="btn btn-danger" style="flex: 1;">
                            ⏸️ Стоп
                        </button>
                    </div>

                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>Загрузка данных...</p>
                    </div>

                    <div id="connectionsList" class="connections-list">
                        <p style="text-align: center; color: #666; padding: 20px;">
                            Нажмите "Обновить" для загрузки подключений
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Контейнер для неавторизованных пользователей (показан по умолчанию) -->
        <div id="unauthorized-view">
            <div class="card">
                <h3 style="margin-top: 0; color: #667eea; text-align: center;">🔐 Вход в систему</h3>

                <!-- Форма авторизации -->
                <div id="login-form">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" placeholder="Введите пароль">
                    </div>
                    <button id="login-btn" class="btn btn-primary">
                        🔑 Войти
                    </button>
                    <p style="text-align: center; margin: 15px 0; color: #666;">Ещё нет аккаунта?</p>
                </div>

                <!-- Форма регистрации -->
                <div id="register-form" style="display: none;">
                    <div class="form-group">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" placeholder="newuser@example.com">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Пароль:</label>
                        <input type="password" id="regPassword" placeholder="Создайте пароль">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Подтвердите пароль:</label>
                        <input type="password" id="confirmPassword" placeholder="Повторите пароль">
                    </div>
                    <button id="register-btn" class="btn btn-success">
                        📝 Зарегистрироваться
                    </button>
                </div>

                <!-- Переключатель между входом и регистрацией -->
                <div style="text-align: center; margin-top: 15px;">
                    <button id="toggle-auth-btn" class="btn" style="background: transparent; color: #667eea; border: 1px solid #667eea;">
                        📝 Создать новый аккаунт
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>303-proxy v2.0.3</p>
        </div>
    </div>
</body>
</html>
