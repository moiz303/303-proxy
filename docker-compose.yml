services:
  # Основной сервер (proxy_core)
  proxy_logic:
    #image: moiz303/proxy-core:production
    build:
      context: .
      dockerfile: /proxy_logic/Dockerfile
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - extension_network

  # Flask-связка для расширения
  flask_bridge:
    #image: moiz303/proxy-flask:production
    build:
      context: .
      dockerfile: /flask_bridge/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - proxy_logic_URL=http://proxy_logic:5050  # Используем Docker DNS
      - FLASK_ENV=production
    depends_on:
      - proxy_logic
    restart: unless-stopped
    networks:
      - extension_network

networks:
  extension_network:
    driver: bridge