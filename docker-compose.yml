version: '3.8'

services:
  # Основной сервер (proxy_logic)
  proxy_server:
    build: ./proxy_server
    ports:
      - "8888:8888"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - extension_network

  # Flask-связка для расширения
  flask_bridge:
    build: ./flask_bridge
    ports:
      - "8080:8080"
    environment:
      - PROXY_SERVER_URL=http://proxy_server:8888  # Используем Docker DNS
      - FLASK_ENV=production
    depends_on:
      - proxy_server
    restart: unless-stopped
    networks:
      - extension_network

networks:
  extension_network:
    driver: bridge