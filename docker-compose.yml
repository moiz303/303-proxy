services:
  # 1. Certbot - получение и обновление сертификатов
  certbot:
    image: certbot/certbot
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache certbot cronie openssl
        
        echo "🔄 Получаем SSL сертификаты через DNS verification..."
        
        certbot certonly --webroot \
        -w /var/www/certbot \
        -d 72-56-72-131.nip.io \
        --email noreply@gmail.com \
        --agree-tos \
        --non-interactive

        if [ -f /etc/letsencrypt/live/72-56-72-131.nip.io/fullchain.pem ]; then
          cp /etc/letsencrypt/live/72-56-72-131.nip.io/fullchain.pem /ssl/nginx.crt
          cp /etc/letsencrypt/live/72-56-72-131.nip.io/privkey.pem /ssl/nginx.key
          echo "✅ Сертификаты Let's Encrypt скопированы"
        else
          echo "❌ Создаем self-signed сертификаты..."
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/nginx.key -out /ssl/nginx.crt \
            -subj "/C=US/ST=State/L=City/O=Org/CN=72-56-72-131.nip.io"
          echo "⚠️ Используются self-signed сертификаты"
        fi

        echo "🔄 Настраиваем cron для автоматического обновления..."
        echo '0 3 * * * certbot renew --manual --preferred-challenges dns --post-hook "cp /etc/letsencrypt/live/72-56-72-131.nip.io/fullchain.pem /ssl/nginx.crt && cp /etc/letsencrypt/live/72-56-72-131.nip.io/privkey.pem /ssl/nginx.key && echo reload 2>/dev/null || echo renew-failed"' > /etc/crontabs/root
        
        echo "🚀 Запускаем cron в фоне..."
        crond -f -d 8
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/ssl
      - ./webroot:/var/www/certbot
    restart: unless-stopped
    networks:
      - extension_network

  # 2. Основной прокси сервер
  proxy_logic:
    image: moiz303/proxy-core:1.0.5
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - extension_network

  # 3. Flask API
  flask_bridge:
    image: moiz303/proxy-flask:1.0.5
    environment:
      - proxy_logic_URL=http://proxy_logic:5050
      - FLASK_ENV=production
    depends_on:
      - proxy_logic
    restart: unless-stopped
    networks:
      - extension_network

  # 5. Основной nginx с SSL (запускается после certbot)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"    # HTTP редирект
      - "443:443"  # HTTPS
      - "5000:5000" # API
    volumes:
      - ./nginx_temp.conf:/etc/nginx/nginx.conf  # Основной конфиг с SSL
      - ./ssl:/etc/ssl/certs
      - ./webroot:/var/www/certbot
    depends_on:
      - proxy_logic
      - flask_bridge
    restart: unless-stopped
    networks:
      - extension_network

networks:
  extension_network:
    driver: bridge