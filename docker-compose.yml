version: '3.8'

services:
  # Основной сервер (proxy_core)
  proxy_logic:
    build:
      context: .                    # ⬅️ КОНТЕКСТ - КОРНЕВАЯ ПАПКА
      dockerfile: proxy_logic/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - extension_network

  # Flask-связка для расширения
  flask_bridge:
    build:
      context: .                    # ⬅️ КОНТЕКСТ - КОРНЕВАЯ ПАПКА
      dockerfile: flask_bridge/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - proxy_logic_URL=http://proxy_logic:8888  # Используем Docker DNS
      - FLASK_ENV=production
    depends_on:
      - proxy_logic
    restart: unless-stopped
    networks:
      - extension_network

networks:
  extension_network:
    driver: bridge