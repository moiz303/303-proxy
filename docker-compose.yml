services:
  # 1. Certbot - получение и обновление сертификатов
  certbot:
    image: certbot/certbot
    entrypoint: []
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache certbot cronie openssl
        
        echo "🔄 Получаем SSL сертификаты через DNS verification..."
        
        certbot certonly --webroot \
        -w /var/www/certbot \
        -d $${DOMAIN} \
        --email $${EMAIL} \
        --agree-tos \
        --non-interactive

        if [ -f /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem ]; then
          cp /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /ssl/nginx.crt
          cp /etc/letsencrypt/live/$${DOMAIN}/privkey.pem /ssl/nginx.key
          echo "✅ Сертификаты Let's Encrypt скопированы"
        else
          echo "❌ Создаем self-signed сертификаты..."
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/nginx.key -out /ssl/nginx.crt \
            -subj "/C=US/ST=State/L=City/O=Org/CN=${DOMAIN}"
          echo "⚠️ Используются self-signed сертификаты"
        fi

        echo "🔄 Настраиваем cron для автоматического обновления..."
        echo '0 3 * * * certbot renew --manual --preferred-challenges dns --post-hook "cp /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /ssl/nginx.crt && cp /etc/letsencrypt/live/$${DOMAIN}/privkey.pem /ssl/nginx.key && echo reload 2>/dev/null || echo renew-failed"' > /etc/crontabs/root
        
        echo "🚀 Запускаем cron в фоне..."
        crond -f -d 8
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/ssl
      - ./webroot:/var/www/certbot
    restart: unless-stopped
    networks:
      - extension_network

  # 2. Основной прокси сервер
  proxy_logic:
    image: moiz303/proxy-core:1.0.5
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - extension_network

  # 3. Flask API
  flask_bridge:
    image: moiz303/proxy-flask:1.0.5
    environment:
      - proxy_logic_URL=http://proxy_logic:5050
      - FLASK_ENV=production
    depends_on:
      - proxy_logic
    restart: unless-stopped
    networks:
      - extension_network

  # 5. Основной nginx с SSL (запускается после certbot)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"    # HTTP редирект
      - "443:443"  # HTTPS
      - "5000:5000" # API
    env_file:
      - .env
    volumes:
      - ./nginx_temp.conf:/etc/nginx/nginx.conf  # Основной конфиг с SSL
      - ./ssl:/etc/ssl/certs
      - ./webroot:/var/www/certbot
    depends_on:
      - proxy_logic
      - flask_bridge
    restart: unless-stopped
    networks:
      - extension_network

  # 6. PostgreSQL - общая база для обоих сервисов
  postgres:
    image: postgres:14-alpine
    container_name: 303-postgres
    restart: unless-stopped
    hostname: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"  # Открываем порт для внешнего подключения (можно убрать в продакшене)
    networks:
      - 303-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

networks:
  extension_network:
    driver: bridge
  303-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}